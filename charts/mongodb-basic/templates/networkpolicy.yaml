{{- if .Values.networkPolicy.enabled }}

{{- if .Values.networkPolicy.graylogClient.enabled }}
{{- $_ := required
      "networkPolicy.graylogClient.namespace must be set when the Graylog client rule is enabled"
      .Values.networkPolicy.graylogClient.namespace
}}
{{- $_ := required
      "networkPolicy.graylogClient.podLabels must contain at least one label when the Graylog client rule is enabled"
      .Values.networkPolicy.graylogClient.podLabels
}}
{{- end }}

{{- if .Values.networkPolicy.backupClient.enabled }}
{{- $_ := required
      "networkPolicy.backupClient.podLabels must contain at least one label when the backup client rule is enabled"
      .Values.networkPolicy.backupClient.podLabels
}}
{{- end }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-allow-graylog
spec:
  podSelector:
    matchLabels:
{{- include "mongodb.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress

  ingress:
    # MongoDB internal traffic
    - from:
        - podSelector:
            matchLabels:
{{- include "mongodb.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}

{{- if .Values.networkPolicy.graylogClient.enabled }}  
    # Graylog -> MongoDB
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.graylogClient.namespace | quote }}
          podSelector:
            matchLabels:
{{- toYaml .Values.networkPolicy.graylogClient.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}

{{- if .Values.networkPolicy.backupClient.enabled }}
    # MongoDB backup access from the MongoDB namespace
    - from:
        - podSelector:
            matchLabels:
{{- toYaml .Values.networkPolicy.backupClient.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
{{- end }}
